# ─── Application ───────────────────────────────────────────────────────────────
spring.application.name=complaint-management-system
server.port=8080

# ─── H2 Database (Local) ────────────────────────────────────────────────────────
# spring.datasource.url=jdbc:h2:mem:cms_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ─── PostgreSQL (Uncomment for Production) ──────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/complaint_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=6D5A7134743777217A25432A462D4A614E645267556B586E3272357538782F41
jwt.expiration=86400000

# ─── File Upload ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# ─── Mail (configure with your SMTP) ────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Scheduling ─────────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=5

# ─── CORS ───────────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173

# ─── OpenAPI ────────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
